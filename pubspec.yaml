name: debate_tab_app
description: Tournament tabulation app for British Parliamentary and Asian Parliamentary debate, inspired by Tabbycat.
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.1.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^4.13.0
  firebase_auth: ^6.5.7
  cloud_firestore: ^6.8.0

  # State management
  flutter_riverpod: ^2.6.1

  # Routing
  go_router: ^14.6.1

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
